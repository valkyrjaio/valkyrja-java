name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks against the new base. A
    # base-branch change has no activity type of its own; GitHub reports it as `edited`, and `edited`
    # is not one of the default types, so such a pull request otherwise sits with no checks at all.
    #
    # `edited` also fires for title and description edits, so the whole suite re-runs for those too.
    # That cost is accepted deliberately. Skipping the jobs instead — via a `changes.base` guard —
    # does not work: a skipped caller job never produces the `<job> / <job>` context the required
    # status checks are waiting for, and GitHub evaluates requirements against the latest run, so an
    # earlier run's success does not carry over. The pull request ends up blocked on
    # "Expected — Waiting for status to be reported" until someone pushes a commit.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  spotless:
    name: Spotless
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'spotless'
      ci-directory: .github/ci/spotless
      paths: |
        ci:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  archunit:
    name: ArchUnit
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'archunit'
      ci-directory: .github/ci/archunit
      paths: |
        ci:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  errorprone:
    name: ErrorProne
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'errorprone'
      ci-directory: .github/ci/errorprone
      paths: |
        ci:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  spotbugs:
    name: SpotBugs
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'spotbugs'
      ci-directory: .github/ci/spotbugs
      paths: |
        ci:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  junit:
    name: JUnit
    uses: valkyrjaio/.github/.github/workflows/_java-junit.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      ci-directory: .github/ci/junit
      paths: |
        ci:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit
