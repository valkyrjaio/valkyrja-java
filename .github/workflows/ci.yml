name: CI

on:
  push:
    branches: [ 'master', '*.x' ]
  pull_request:
    # `edited` is included so a pull request that GitHub auto-retargets — which happens to a stacked
    # pull request the moment its parent merges — re-runs its checks. A base-branch change has no
    # activity type of its own; GitHub reports it as `edited` with a `changes.base` payload, and
    # `edited` is not one of the default types, so such a pull request otherwise sits with no checks
    # at all. `edited` also fires for title and description edits, so the tool jobs below additionally
    # require `changes.base` rather than replaying a whole matrix for a reworded description.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ 'master', '*.x' ]

permissions:
  pull-requests: write
  contents: read

jobs:
  commit-message-check:
    name: Commit Message Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_commit-message-check.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    secrets: inherit

  trailing-newline-check:
    name: Trailing Newline Check
    if: github.event_name == 'pull_request'
    uses: valkyrjaio/.github/.github/workflows/_trailing-newline-check.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    permissions:
      pull-requests: write
      contents: read
    secrets: inherit

  spotless:
    name: Spotless
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'spotless'
      ci-directory: .github/ci/spotless
      paths: |
        ci:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotless/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  archunit:
    name: ArchUnit
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'archunit'
      ci-directory: .github/ci/archunit
      paths: |
        ci:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/archunit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  errorprone:
    name: ErrorProne
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'errorprone'
      ci-directory: .github/ci/errorprone
      paths: |
        ci:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/errorprone/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  spotbugs:
    name: SpotBugs
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_java-ci-tool.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      tool: 'spotbugs'
      ci-directory: .github/ci/spotbugs
      paths: |
        ci:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/spotbugs/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
          - '.github/ci/junit/src/test/**/*.java'
    secrets: inherit

  junit:
    name: JUnit
    if: github.event.action != 'edited' || github.event.changes.base
    uses: valkyrjaio/.github/.github/workflows/_java-junit.yml@ddea291816127b905f6e00006e998f4a6851c1e8
    with:
      ci-directory: .github/ci/junit
      paths: |
        ci:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
        files:
          - '.github/ci/junit/**'
          - '.github/workflows/ci.yml'
          - 'src/**/*.java'
    secrets: inherit
